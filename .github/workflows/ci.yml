name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones viejas del mismo branch/PR si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    # Postgres real para validar migraciones de Prisma en CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: luci
          POSTGRES_PASSWORD: luci
          POSTGRES_DB: luci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U luci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://luci:luci@localhost:5433/luci?schema=public
      AUTH_SECRET: ci-secret-not-used-in-prod
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
